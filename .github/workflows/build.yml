name: Build APK
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q NotiLED.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: |
          chmod +x NotiLED/gradlew
          cd NotiLED
          ./gradlew --no-daemon assembleRelease
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp NotiLED/app/build/outputs/apk/release/app-release.apk NotiLED-Light.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest NotiLED-Light.apk --title "Notification Light" --notes "Open-source notification light. No internet permission." --latest
